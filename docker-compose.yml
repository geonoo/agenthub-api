services:
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: agenthub-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - API_KEY=${API_KEY:-change-me-in-production}
      - MASTER_API_KEY=${MASTER_API_KEY:-}
      - DART_API_KEY=${DART_API_KEY:-}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-60}
      - RATE_LIMIT_WINDOW_SECONDS=${RATE_LIMIT_WINDOW_SECONDS:-60}
      - FREE_TIER_DAILY_LIMIT=${FREE_TIER_DAILY_LIMIT:-1000}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/agenthub.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://agenthub.co.kr,https://api.agenthub.co.kr}
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    networks:
      - agenthub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    container_name: agenthub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      fastapi-app:
        condition: service_healthy
    networks:
      - agenthub-net

  certbot:
    image: certbot/certbot:latest
    container_name: agenthub-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    profiles:
      - certs
    entrypoint: certbot

networks:
  agenthub-net:
    driver: bridge
