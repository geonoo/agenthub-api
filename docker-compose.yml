services:
  fastapi-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agenthub-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - API_KEY=${API_KEY:-change-me-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://agenthub.co.kr,https://api.agenthub.co.kr}
    expose:
      - "8000"
    networks:
      - agenthub-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:1.27-alpine
    container_name: agenthub-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      fastapi-app:
        condition: service_healthy
    networks:
      - agenthub-net

  # Optional: certificate issuance / renewal helper
  # Usage:
  #   docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
  #     -d agenthub.co.kr -d api.agenthub.co.kr --email you@example.com --agree-tos
  certbot:
    image: certbot/certbot:latest
    container_name: agenthub-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    profiles:
      - certs
    entrypoint: certbot

networks:
  agenthub-net:
    driver: bridge
